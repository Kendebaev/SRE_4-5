version: '3.8'

networks:
  ecommerce-net:
    driver: bridge

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supersecurepassword}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce_db}
    # Optimizing Postgres for low memory usage
    command: >
      postgres 
      -c shared_buffers=64MB 
      -c work_mem=4MB 
      -c effective_cache_size=128MB 
      -c max_connections=50
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-ecommerce_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 300M

  auth:
    build: 
      context: ./services/auth
    container_name: auth-service
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-appuser}:${POSTGRES_PASSWORD:-supersecurepassword}@postgres:5432/${POSTGRES_DB:-ecommerce_db}
      - SECRET_KEY=${SECRET_KEY:-default_secret}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-net
    deploy:
      resources:
        limits:
          memory: 100M

  product:
    build: 
      context: ./services/product
    container_name: product-service
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-appuser}:${POSTGRES_PASSWORD:-supersecurepassword}@postgres:5432/${POSTGRES_DB:-ecommerce_db}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-net
    deploy:
      resources:
        limits:
          memory: 100M

  order:
    build: 
      context: ./services/order
    container_name: order-service
    environment:
      # Explicit definition for incident simulation target
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-appuser}:${POSTGRES_PASSWORD:-supersecurepassword}@postgres:5432/${POSTGRES_DB:-ecommerce_db}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-net
    deploy:
      resources:
        limits:
          memory: 100M

  user_chat:
    build: 
      context: ./services/user_chat
    container_name: user-chat-service
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-appuser}:${POSTGRES_PASSWORD:-supersecurepassword}@postgres:5432/${POSTGRES_DB:-ecommerce_db}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-net
    deploy:
      resources:
        limits:
          memory: 100M

  user:
    build:
      context: ./services/user
    container_name: user-service
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-appuser}:${POSTGRES_PASSWORD:-supersecurepassword}@postgres:5432/${POSTGRES_DB:-ecommerce_db}
      # Must share the same SECRET_KEY as auth so JWT tokens can be validated
      - SECRET_KEY=${SECRET_KEY:-default_secret}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-net
    deploy:
      resources:
        limits:
          memory: 100M

  nginx:
    image: nginx:alpine
    container_name: nginx-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - auth
      - product
      - order
      - user_chat
      - user
    networks:
      - ecommerce-net
    deploy:
      resources:
        limits:
          memory: 50M

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - ecommerce-net
    deploy:
      resources:
        limits:
          memory: 250M

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - ecommerce-net
    deploy:
      resources:
        limits:
          memory: 200M
