version: '3.8'

networks:
  ecommerce-net:
    driver: overlay
    attachable: true

volumes:
  postgres-data:

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: supersecurepassword
      POSTGRES_DB: ecommerce_db
    command: >
      postgres
      -c shared_buffers=64MB
      -c work_mem=4MB
      -c effective_cache_size=128MB
      -c max_connections=50
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d ecommerce_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          memory: 300M

  auth-service:
    image: nexshop-auth:latest
    build:
      context: ./services/auth
    environment:
      - DATABASE_URL=postgresql+asyncpg://appuser:supersecurepassword@postgres:5432/ecommerce_db
      - SECRET_KEY=y0ur_s3cr3t_k3y_for_jwt_s1gn1ng_pls_change
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 100M

  product-service:
    image: nexshop-product:latest
    build:
      context: ./services/product
    environment:
      - DATABASE_URL=postgresql+asyncpg://appuser:supersecurepassword@postgres:5432/ecommerce_db
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 100M

  order-service:
    image: nexshop-order:latest
    build:
      context: ./services/order
    environment:
      - DATABASE_URL=postgresql+asyncpg://appuser:supersecurepassword@postgres:5432/ecommerce_db
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 100M

  user-service:
    image: nexshop-user:latest
    build:
      context: ./services/user
    environment:
      - DATABASE_URL=postgresql+asyncpg://appuser:supersecurepassword@postgres:5432/ecommerce_db
      - SECRET_KEY=y0ur_s3cr3t_k3y_for_jwt_s1gn1ng_pls_change
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 100M

  user-chat-service:
    image: nexshop-user-chat:latest
    build:
      context: ./services/user_chat
    environment:
      - DATABASE_URL=postgresql+asyncpg://appuser:supersecurepassword@postgres:5432/ecommerce_db
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 100M

  payment-service:
    image: nexshop-payment:latest
    build:
      context: ./services/payment
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 100M

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    configs:
      - source: nginx_conf
        target: /etc/nginx/nginx.conf
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 50M

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    configs:
      - source: prometheus_conf
        target: /etc/prometheus/prometheus.yml
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 250M

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    configs:
      - source: grafana_datasources
        target: /etc/grafana/provisioning/datasources/datasources.yml
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 200M

configs:
  nginx_conf:
    file: ./nginx/nginx.conf
  prometheus_conf:
    file: ./prometheus/prometheus.yml
  grafana_datasources:
    file: ./grafana/datasources.yml
