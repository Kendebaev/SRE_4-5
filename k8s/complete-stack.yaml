# =============================================================================
# NexShop — Complete Kubernetes Stack
# Apply with: kubectl apply -f complete-stack.yaml
# =============================================================================

# ── Namespace ────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: nexshop
---
# ── ConfigMap — shared environment variables ─────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: nexshop-config
  namespace: nexshop
data:
  DATABASE_URL: "postgresql+asyncpg://appuser:supersecurepassword@postgres:5432/ecommerce_db"
  SECRET_KEY: "y0ur_s3cr3t_k3y_for_jwt_s1gn1ng_pls_change"
  POSTGRES_USER: "appuser"
  POSTGRES_PASSWORD: "supersecurepassword"
  POSTGRES_DB: "ecommerce_db"
  GF_SECURITY_ADMIN_PASSWORD: "admin"
---
# =============================================================================
#  POSTGRES
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: nexshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: nexshop-config
          args:
            - "-c"
            - "shared_buffers=64MB"
            - "-c"
            - "work_mem=4MB"
            - "-c"
            - "effective_cache_size=128MB"
            - "-c"
            - "max_connections=50"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "appuser", "-d", "ecommerce_db"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "appuser", "-d", "ecommerce_db"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            limits:
              memory: "300Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: nexshop
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
# =============================================================================
#  AUTH SERVICE
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: nexshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: nexshop-auth:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: nexshop-config
                  key: DATABASE_URL
            - name: SECRET_KEY
              valueFrom:
                configMapKeyRef:
                  name: nexshop-config
                  key: SECRET_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            limits:
              memory: "100Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: nexshop
spec:
  selector:
    app: auth-service
  ports:
    - port: 8000
      targetPort: 8000
---
