worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    
    sendfile on;
    keepalive_timeout 30;
    gzip on;
    access_log off; # Minimize IO for low RAM

    server {
        listen 80;
        server_name localhost;

        # Frontend
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ =404;
        }

        # Auth Service
        location /api/auth/ {
            proxy_pass http://auth:8000/api/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        location /api/auth/health {
            proxy_pass http://auth:8000/health;
        }

        # Product Service
        location /api/products/ {
            proxy_pass http://product:8000/api/products/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        location /api/products/health {
            proxy_pass http://product:8000/health;
        }

        # Order Service
        location /api/orders/ {
            proxy_pass http://order:8000/api/orders/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        location /api/orders/health {
            proxy_pass http://order:8000/health;
        }

        # User Profile Service
        location /api/users/ {
            proxy_pass http://user:8000/api/users/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }
        
        location /api/users/health {
            proxy_pass http://user:8000/health;
        }

        # Chat WebSocket Support
        location /api/chat/ws/ {
            proxy_pass http://user_chat:8000/api/chat/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location /api/chat/health {
            proxy_pass http://user_chat:8000/health;
        }
    }
}
